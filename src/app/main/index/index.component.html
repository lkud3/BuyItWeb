<div *ngIf="!selectedProduct">
<!-- Header-->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Shop in style</h1>
            <p class="lead fw-normal text-white-50 mb-0">With BuyIt</p>
        </div>
    </div>
  </header>
  
  <!-- Section-->
  <section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            
            <div class="col mb-5" *ngFor="let product of products">
                <div class="card h-100" (click)="onSelectProduct(product)" style="cursor: pointer;">
                    <!-- Product image-->
                    <img class="card-img-top" src="{{product.images[0]}}" />
                    <!-- Product details-->
                    <div class="card-body p-4">
                        <div class="text-center">
                            <!-- Product name-->
                            <h5 class="fw-bolder">{{product.name}}</h5>
                            <!-- Product reviews-->
                             <div class="d-flex justify-content-center small text-warning mb-2">
                                <ng-container  *ngFor="let star of [].constructor(getRoundedRating(product.rating)); let i = index">
                                    <span class="bi-star-fill"></span>
                                </ng-container>
                            </div>
                            <!-- Product price-->
                            <p>${{product.price}}</p>
                            <p>{{product.views}} <i class="bi bi-eye"></i></p>
                        </div>
                    </div>
                    <!-- Product actions-->
                    <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                        <div class="text-center"><a class="btn btn btn-dark mt-auto" (click)="addToCart(product, $event)">Add to cart</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </section>
</div>
  <app-item-card *ngIf="selectedProduct" [item_card_id]="selectedProduct" (backToIndex)="onBackToIndex()"></app-item-card>
