<div class="container custom-margin-top position-relative">
    <button class="btn btn-secondary position-absolute" style="top: 10px; left: 10px;" (click)="onBack()">
        <i class="bi bi-arrow-left"></i> Back to Products 
    </button>
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-3">
            
        <h1 style="font-weight: bold;">{{ item_card_id.name }}</h1>
        <p>{{ item_card_id.description }}</p>
        </div>

        <!-- Carousel for images -->
    
        <div class="col-md-8">
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" *ngFor="let image of item_card_id.images; let i = index" 
                            [attr.data-bs-target]="'#carouselExampleAutoplaying'" 
                            [attr.data-bs-slide-to]="i" 
                            [class.active]="i === 0" 
                            [attr.aria-current]="i === 0 ? 'true' : 'false'" 
                            [attr.aria-label]="'Slide ' + (i + 1)">
                    </button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item" *ngFor="let image of item_card_id.images; let i = index" [class.active]="i === 0">
                        <img [src]="image" alt="{{ item_card_id.name }}" class="d-block w-100">
                    </div>
                </div>
                <a class="carousel-control-prev" role="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </a>
                <a class="carousel-control-next" role="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </a>
            </div>
        </div>
    </div>

    <h3 class="mt-4 text-center" style="font-weight: bold;">Price:  ${{ item_card_id.price }}</h3>

    <!-- Comments Section -->
    <div class="row justify-content-center mt-4">
        <div class="col-md-10 text-center">
            <h4 class="mb-3">Comments</h4>
            <div *ngIf="reviews && reviews.length > 0">
                <div *ngFor="let review of reviews" class="mb-3">
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <ng-container *ngFor="let user of users">
                                    <ng-container *ngIf="user.id === review.userId">
                                        <div class="col-lg-4 d-flex justify-content-center align-items-center mb-4 mb-lg-0">
                                            <img src="{{user.thumbnail}}"
                                                 class="rounded-circle img-fluid shadow-1" alt="{{user.id}}" width="100" height="100" />
                                        </div>
                                        <div class="col-lg-8">
                                            <p class="text-muted fw-light mb-4">{{ review.comment }}</p>
                                            <p class="fw-bold lead mb-2"><strong>{{user.username}}</strong></p>
                                            <p class="fw-bold text-muted mb-0">{{review.date}}</p>
                                        </div>
                                    </ng-container>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div *ngIf="!reviews || reviews.length === 0">
                <p>No comments available.</p>
            </div>
        </div>
    </div>

    <!-- Rating Section -->
    <div class="row justify-content-center mt-2  mb-3">
        <div class="text-center">
            <div *ngIf="rating === 0">
                <h4>Rate this product!</h4>
                <div class="star-rating">
                    <span *ngFor="let star of [1, 2, 3, 4, 5]" 
                        (click)="rateProduct(star)" 
                        [ngClass]="{'filled': star <= rating, 'empty': star > rating}">
                        ★
                    </span>
                </div>
            </div>
            <div *ngIf="rating > 0">
                <h4>Thank you for your rating!</h4>
                <div class="star-rating">
                    <span *ngFor="let star of [1, 2, 3, 4, 5]" 
                            [ngClass]="{'filled': star <= rating, 'empty': star > rating}">
                            ★
                    </span>
                </div>
        </div>
    </div>
</div>
